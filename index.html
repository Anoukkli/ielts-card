<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="雅思复习">
<link rel="icon" href="data:,">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>雅思复习</title>
<style>
  :root{
    --bg:#0f1115; --card:#171a21; --card2:#1e222b; --line:#2a2f3a;
    --fg:#eef1f6; --dim:#9aa4b2; --accent:#4f8cff; --good:#34c759;
    --meh:#ff9f0a; --bad:#ff453a; --radius:20px;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f2f4f8; --card:#ffffff; --card2:#eef1f6; --line:#dfe4ec;
           --fg:#171a21; --dim:#6b7480; }
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","Segoe UI",Roboto,sans-serif;
    min-height:100dvh; display:flex; flex-direction:column;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    user-select:none; overscroll-behavior:none;
  }
  header{padding:18px 20px 8px; display:flex; align-items:center; justify-content:space-between;}
  header h1{font-size:17px; font-weight:600; margin:0; letter-spacing:.02em;}
  header .streak{font-size:13px; color:var(--dim);}
  header .streak b{color:var(--meh); font-size:15px;}
  main{flex:1; display:flex; flex-direction:column; padding:8px 20px calc(20px + env(safe-area-inset-bottom));}

  /* ---------- home ---------- */
  .ring-wrap{display:flex; flex-direction:column; align-items:center; margin:10px 0 22px;}
  .ring{position:relative; width:190px; height:190px;}
  .ring svg{transform:rotate(-90deg);}
  .ring .num{position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center;}
  .ring .num strong{font-size:40px; font-weight:700; letter-spacing:-.02em;}
  .ring .num span{font-size:12px; color:var(--dim); margin-top:2px;}
  .ring path{transition:stroke-dashoffset .5s ease;}

  .actions{display:flex; flex-direction:column; gap:12px; margin-top:6px;}
  .btn{
    border:0; border-radius:16px; padding:17px 18px; font-size:16px; font-weight:600;
    background:var(--card); color:var(--fg); display:flex; align-items:center;
    justify-content:space-between; transition:transform .08s ease, background .15s;
    font-family:inherit;
  }
  .btn:active{transform:scale(.98);}
  .btn.primary{background:var(--accent); color:#fff;}
  .btn small{font-weight:500; opacity:.65; font-size:13px; margin-left:14px; text-align:right; flex:none;}
  .btn:disabled{opacity:.45;}

  .foot{margin-top:auto; padding-top:18px; display:flex; justify-content:space-between;
        font-size:12px; color:var(--dim);}
  .foot a{color:var(--dim); text-decoration:none;}

  /* ---------- card ---------- */
  .stage{flex:1; display:flex; flex-direction:column;}
  .topbar{display:flex; align-items:center; gap:12px; margin-bottom:10px;}
  .topbar .bar{flex:1; height:5px; background:var(--line); border-radius:3px; overflow:hidden;}
  .topbar .bar i{display:block; height:100%; width:0; background:var(--accent);
                 border-radius:3px; transition:width .3s ease;}
  .topbar .count{font-size:12px; color:var(--dim); font-variant-numeric:tabular-nums;}
  .close{background:none;border:0;color:var(--dim);font-size:22px;padding:0 4px;line-height:1;}

  .scene{flex:1; perspective:1400px; display:flex; align-items:stretch; padding:6px 0 14px;}
  .card{
    position:relative; width:100%; min-height:330px; transform-style:preserve-3d;
    transition:transform .45s cubic-bezier(.2,.8,.3,1); cursor:pointer;
  }
  .card.flipped{transform:rotateY(180deg);}
  .face{
    position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
    background:var(--card); border-radius:var(--radius); border:1px solid var(--line);
    padding:26px 22px; display:flex; flex-direction:column; overflow:auto;
  }
  .face.back{transform:rotateY(180deg);}

  .word{font-size:36px; font-weight:700; letter-spacing:-.02em; line-height:1.2; word-break:break-word;}
  .word.small{font-size:26px;}
  .tier{font-size:11px; color:var(--dim); letter-spacing:.1em;}
  .spellrow{display:flex; gap:10px; align-items:center; margin-top:16px;}
  .spell-in{flex:1; min-width:0; font-size:20px; padding:14px 16px; border-radius:14px;
            border:1px solid var(--line); background:var(--card2); color:var(--fg); font-family:inherit;}
  .spell-in:focus{outline:none; border-color:var(--accent);}
  .sub{color:var(--dim); font-size:13px; margin-top:10px;}
  .speak{
    margin-top:auto; align-self:flex-start; border:1px solid var(--line);
    background:var(--card2); color:var(--fg); border-radius:999px; padding:9px 16px;
    font-size:14px; display:flex; align-items:center; gap:7px; font-family:inherit;
  }
  .hint{color:var(--dim); font-size:12px; text-align:center; margin-top:auto;}

  .meaning{font-size:20px; font-weight:600; line-height:1.4;}
  .block{margin-top:16px;}
  .block .k{font-size:11px; color:var(--dim); letter-spacing:.08em; margin-bottom:5px;}
  .ex{font-size:15px; line-height:1.65; color:var(--fg);}
  .ex b{color:var(--accent); font-weight:700;}
  .excn{font-size:13px; color:var(--dim); line-height:1.6; margin-top:4px;}
  .col{font-size:14px; line-height:1.6;}
  .src{font-size:11px; color:var(--dim); margin-top:auto; padding-top:14px;}

  .grades{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;}
  .grade{border:0; border-radius:14px; padding:15px 8px; font-size:14px; font-weight:600;
         color:#fff; font-family:inherit; transition:transform .08s;
         touch-action:manipulation; -webkit-user-select:none; user-select:none;}
  .grade:active{transform:scale(.97);}
  .grade.bad{background:var(--bad);} .grade.meh{background:var(--meh);} .grade.good{background:var(--good);}
  .grade small{display:block; font-weight:400; font-size:10px; opacity:.8; margin-top:3px;}

  /* ---------- error card ---------- */
  .qid{font-size:12px; color:var(--dim); letter-spacing:.06em;}
  .stem{font-size:19px; line-height:1.55; font-weight:600; margin-top:8px; white-space:pre-wrap;}
  .ansline{display:flex; gap:18px; margin-top:18px; font-size:15px; flex-wrap:wrap;}
  .ansline div span{color:var(--dim); font-size:12px; display:block; margin-bottom:3px;}
  .mine{color:var(--bad); font-weight:600;} .right{color:var(--good); font-weight:600;}

  /* ---------- 错题卡 v2：标签、选项、播放区、分层展开 ---------- */
  .tags{display:flex; flex-wrap:wrap; gap:6px;}
  .tag{font-size:11px; padding:3px 9px; border-radius:999px; background:var(--card2);
       color:var(--dim); border:1px solid var(--line);}
  .tag.l{color:var(--accent);} .tag.r{color:var(--meh);}
  .opts{margin-top:12px; display:flex; flex-direction:column; gap:8px;}
  .opt{border:1px solid var(--line); background:var(--card2); border-radius:12px; padding:11px 13px;
       font-size:15px; line-height:1.45; text-align:left; color:var(--fg); font-family:inherit;
       display:flex; gap:10px; align-items:baseline;}
  .opt:active{transform:scale(.99);}
  .opt .ol{flex:none; font-weight:700; color:var(--dim);}
  .opt.ok{border-color:var(--good);} .opt.ok .ol{color:var(--good);}
  .opt.no{border-color:var(--bad);} .opt.no .ol{color:var(--bad);}
  .player{margin-top:14px; display:flex; flex-wrap:wrap; gap:8px;}
  .pbtn{border:1px solid var(--line); background:var(--card2); color:var(--fg); border-radius:999px;
        padding:10px 15px; font-size:14px; font-family:inherit;}
  .pbtn.on{border-color:var(--accent); color:var(--accent);}
  .step{margin-top:12px; border-top:1px solid var(--line); padding-top:8px;}
  .step summary{font-size:13px; font-weight:600; color:var(--dim); cursor:pointer; list-style:none; padding:5px 0;}
  .step summary::-webkit-details-marker{display:none;}
  .step summary::before{content:'▸ ';}
  .step[open] summary::before{content:'▾ ';}
  .stepbody{padding:4px 0 2px;}
  .quote{white-space:pre-wrap;}
  .pair{font-size:15px; line-height:1.7;} .pair .arrow{color:var(--accent); font-weight:700;}
  .col.next{color:var(--good);}

  /* ---------- 错题首页 ---------- */
  .eh h2{font-size:19px; margin:6px 0 16px;}
  .tabs{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .tab{border:1px solid var(--line); background:var(--card); color:var(--fg); border-radius:16px;
       padding:14px 10px; font-size:16px; font-weight:600; text-align:center; font-family:inherit;}
  .tab small{display:block; font-weight:500; font-size:12px; color:var(--dim); margin-top:3px;}
  .tab.on{border-color:var(--accent); background:var(--card2);}
  .eh .k{font-size:12px; color:var(--dim); margin:18px 0 8px;}
  .chips{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{border:1px solid var(--line); background:var(--card); color:var(--fg); border-radius:999px;
        padding:8px 13px; font-size:13px; font-family:inherit;}
  .chip.on{border-color:var(--accent); color:var(--accent);}
  .cells{display:flex; flex-direction:column; gap:8px;}
  .cell{border:1px solid var(--line); background:var(--card); color:var(--fg); border-radius:14px;
        padding:12px 14px; text-align:left; font-size:14px; font-family:inherit; line-height:1.5;}
  .cell.on{border-color:var(--accent);}
  .cell b{font-size:15px;}
  .cell span{color:var(--dim); font-size:13px; display:block; margin-top:2px;}

  /* ---------- done ---------- */
  .done{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; text-align:center;}
  .done .big{font-size:64px; line-height:1;}
  .done h2{font-size:22px; margin:12px 0 0;}
  .done p{color:var(--dim); font-size:14px; margin:4px 0;}
  .stats{display:flex; gap:26px; margin:22px 0 6px;}
  .stats div{text-align:center;}
  .stats b{display:block; font-size:22px;}
  .stats span{font-size:11px; color:var(--dim);}
  .toast{position:fixed; left:50%; bottom:34px; transform:translateX(-50%) translateY(20px);
    background:#000c; color:#fff; padding:10px 18px; border-radius:999px; font-size:13px;
    opacity:0; transition:.25s; pointer-events:none;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<header>
  <h1 id="title">雅思复习</h1>
  <div class="streak" id="streak"></div>
</header>
<main id="app"></main>
<div class="toast" id="toast"></div>

<script src="writing.js"></script>
<script src="patterns.js"></script>
<script src="ideas.js"></script>
<script src="essay.js"></script>
<script src="backup.js"></script>

<script>
/* =========================================================
   雅思复习 PWA —— 数据来自 deck.json，进度存在本机
   ========================================================= */
const KEY_SRS = 'ielts.srs.v2';
const KEY_CFG = 'ielts.cfg.v2';
const KEY_STAT = 'ielts.stat.v2';
const INTERVALS = [1, 2, 4, 7, 15, 30, 60];
const DEFAULTS = { quota: 40, spell: false };

/* ---- 错题模块 ---- */
const ERR_BATCH = 20;      // 每轮最多刷多少道
const ERR_GRAD = 2;        // 连续答对几次移出队列
const ERR_FILL = ['填空题', '摘要填空', '句子完成', '简答题', '图表/流程题', '地图/方位题'];
// 「最常错」每一格下面的一句对策（来自 taxonomy.md 的「破题动作」）
const TYPE_ADVICE = {
  '填空题': '先判词性，再回原文找同义替换，最后数字数',
  '摘要填空': '先读 summary 首句定段落，按顺序推进',
  '句子完成': '用语法预判：单复数、时态、搭配',
  '简答题': '只回答被问的那个成分，别多写',
  '单选题': 'but / however 前面的信息先标记可疑',
  '多选题': '每个选项单独判真假，不靠感觉',
  '标题匹配': '读段首尾和转折句，抓整段主旨',
  '信息匹配': '先扫题干关键词，再扫段落首句',
  '特征匹配': '边听边在选项旁记缩写，防张冠李戴',
  '判断题': 'F 是原文说了相反；NG 是原文没提或无法判断',
  '地图/方位题': '先定起点和朝向，再记 turn / opposite / next to',
  '图表/流程题': '先看表头和箭头方向，预判词性',
};
// 同一格的错因比题型更说明问题时，优先给错因的对策（听力、阅读各一套）
const CAUSE_ADVICE = {
  '替换没识别': '把「原文 → 题干」的替换抄下来，每周汇总',
  '干扰项误选': '被哪个词吸引就圈出来，再回原文核对',
  '定位失败': '先圈题干关键词，再扫段落首句',
  '词汇不认识': '答案句里的生词进生词库',
  '过度推断': '只认原文说了什么，不认合理',
  '审题不清': '做题前圈出字数限制和题型要求',
  '速度跟不上': '限时做一篇，先保正确再提速',
};
const CAUSE_ADVICE_L = {
  '拼写/语法': '听写答案词，核对单复数和词尾',
  '音近/连读': '把定位句听写三遍，对照原句找听错的音',
  '漏听/走神': '连前一句一起听，听到转折词再落笔',
};
const CAUSE_ADVICE_R = {
  '拼写/语法': '填空先判词性和单复数，答案照抄原词',
};
function cellAdvice(skill, type, cause){
  return (skill === '听力' ? CAUSE_ADVICE_L : CAUSE_ADVICE_R)[cause] || CAUSE_ADVICE[cause] || TYPE_ADVICE[type] || '';
}

let DECK = { vocab: [], errors: [] };
let SRS = {};      // id -> {s,d,r,w,ls}
let CFG = {...DEFAULTS};
let STAT = { streak: 0, lastDay: '', total: 0, doneDay: '', doneCount: 0 };

const app = document.getElementById('app');
const $ = (id) => document.getElementById(id);

/* ---------------- storage ---------------- */
let STORAGE_OK = true;
function sget(k){
  try{ return localStorage.getItem(k); }catch(e){ STORAGE_OK = false; return null; }
}
function sset(k, v){
  try{ localStorage.setItem(k, v); return true; }
  catch(e){ STORAGE_OK = false; return false; }
}
function loadAll(){
  try{ SRS = JSON.parse(sget(KEY_SRS) || '{}'); }catch(e){ SRS = {}; }
  try{ CFG = {...DEFAULTS, ...JSON.parse(sget(KEY_CFG) || '{}')}; }catch(e){ CFG = {...DEFAULTS}; }
  try{ STAT = {streak:0,lastDay:'',total:0,doneDay:'',doneCount:0, ...JSON.parse(sget(KEY_STAT) || '{}')}; }catch(e){}
}
function saveSRS(){ sset(KEY_SRS, JSON.stringify(SRS)); }
function saveCfg(){ sset(KEY_CFG, JSON.stringify(CFG)); }
function saveStat(){ sset(KEY_STAT, JSON.stringify(STAT)); }

/* ---------------- date helpers ---------------- */
function dayStr(d = new Date()){
  const t = new Date(d.getTime() - d.getTimezoneOffset()*60000);
  return t.toISOString().slice(0,10);
}
function addDays(d, n){ const x = new Date(d); x.setDate(x.getDate()+n); return x; }

/* ---------------- queue ---------------- */
function isDue(card){
  const st = SRS[card.id];
  if(!st) return false;
  return st.d <= dayStr();
}
function unseen(){
  return DECK.vocab.filter(c => !SRS[c.id]);
}
function dueVocab(){
  return DECK.vocab.filter(isDue).sort((a,b)=>{
    const sa = SRS[a.id].s, sb = SRS[b.id].s;
    if(sa !== sb) return sa - sb;                       // 阶段低的优先
    return SRS[a.id].d.localeCompare(SRS[b.id].d);      // 到期早的优先
  });
}
function errorActive(e){
  const st = SRS[e.id];
  return !st || st.s < ERR_GRAD;          // 没有记录，或还没连续答对够
}
function dueErrors(){
  // 没有复习记录的错题也算到期：记录只能在刷题时产生，否则新题永远进不了队列
  return DECK.errors.filter(e => errorActive(e) && (!SRS[e.id] || SRS[e.id].d <= dayStr()));
}
function errorQueue(view){
  // view: {skill, type, cause}；没填科目的旧题在两个 tab 里都出现
  return dueErrors()
    .filter(e => (!view.skill || !e.skill || e.skill === view.skill)
              && (!view.type || e.type === view.type)
              && (!view.cause || e.cause === view.cause))
    .sort((a, b) => {
      const x = SRS[a.id], y = SRS[b.id];
      if(!x || !y) return x ? -1 : 1;                 // 到期复习的排前面，新题按原顺序
      return x.s !== y.s ? x.s - y.s : x.d.localeCompare(y.d);
    });
}
function errorSummary(skill){
  // 该科目全部错题里 题型×错因 最多的 3 格
  const c = {};
  DECK.errors.forEach(e => {
    if((!skill || !e.skill || e.skill === skill) && e.type && e.cause){
      const k = e.type + '|' + e.cause;
      c[k] = (c[k] || 0) + 1;
    }
  });
  return Object.entries(c).sort((a, b) => b[1] - a[1]).slice(0, 3);
}
function hasStem(e){
  const s = String(e.stem || '').trim();
  return !!s && s !== String(e.qid || '').trim();
}
function doneToday(){
  return STAT.doneDay === dayStr() ? (STAT.doneCount || 0) : 0;
}
function remainingQuota(){
  return Math.max(0, CFG.quota - doneToday());
}
function todayQueue(){
  const left = remainingQuota();
  if(left <= 0) return [];
  const due = dueVocab();
  const fresh = shuffle(unseen()).slice(0, Math.max(0, left - due.length));
  return due.slice(0, left).concat(fresh).slice(0, left);
}
function shuffle(a){
  const x = a.slice();
  for(let i=x.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [x[i],x[j]]=[x[j],x[i]]; }
  return x;
}

/* ---------------- srs ---------------- */
function ensure(card){
  if(!SRS[card.id]) SRS[card.id] = { s:0, d:dayStr(), r:0, w:0, ls:'' };
  return SRS[card.id];
}
function gradeCard(card, result){
  const st = ensure(card);
  if(result === 'good'){ st.s = Math.min(st.s + 1, INTERVALS.length - 1); st.r++; }
  else if(result === 'meh'){ st.w++; }
  else { st.s = Math.max(0, st.s - 2); st.w++; }
  const gap = result === 'bad' ? 1 : INTERVALS[Math.min(st.s, INTERVALS.length - 1)];
  st.d = dayStr(addDays(new Date(), gap));
  st.ls = dayStr();
  saveSRS();
}
function gradeError(card, ok){
  const st = ensure(card);
  if(ok){ st.s = Math.min(st.s + 1, ERR_GRAD); st.r++; st.d = dayStr(addDays(new Date(), INTERVALS[Math.min(st.s, 5)])); }
  else { st.s = 0; st.w++; st.d = dayStr(addDays(new Date(), 2)); }
  st.ls = dayStr();
  saveSRS();
}

/* ---------------- stats ---------------- */
function bumpSession(){
  const today = dayStr();
  if(STAT.lastDay === today) return;
  const yesterday = dayStr(addDays(new Date(), -1));
  STAT.streak = (STAT.lastDay === yesterday) ? STAT.streak + 1 : 1;
  STAT.lastDay = today;
  saveStat();
}
function renderStreak(){
  const el = $('streak');
  if(!el) return;
  const today = dayStr();
  const done = STAT.lastDay === today;
  el.innerHTML = STAT.streak > 0
    ? `<b>🔥 ${STAT.streak}</b> 天${done ? ' · 今日已打卡' : ''}`
    : '还没开始';
}

/* ---------------- views ---------------- */
function home(){
  const q = todayQueue();
  const left = remainingQuota();
  const errs = dueErrors();
  const dueN = q.filter(c => SRS[c.id]).length;
  const newN = q.length - dueN;
  const seen = Object.keys(SRS).length;
  const total = DECK.vocab.length;
  const pct = total ? Math.min(100, Math.round(seen / total * 100)) : 0;
  const C = 2 * Math.PI * 82;

  app.innerHTML = `
    <div class="ring-wrap">
      <div class="ring">
        <svg width="190" height="190" viewBox="0 0 190 190">
          <circle cx="95" cy="95" r="82" fill="none" stroke="var(--line)" stroke-width="12"/>
          <circle cx="95" cy="95" r="82" fill="none" stroke="var(--accent)" stroke-width="12"
                  stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C - C*pct/100}"/>
        </svg>
        <div class="num"><strong>${q.length}</strong><span>${left ? '今日待背' : '今日已完成'}</span></div>
      </div>
    </div>

function normalize(s){
  return String(s).toLowerCase().trim().replace(/[.,;:!?'"’]+$/,'').replace(/\s+/g,' ');
}

/* -------- 错题卡 -------- */
/* -------- 错题卡：正面遮住答案重做，背面一层层展开 -------- */
function optLines(stem){
  // 题干 + 逐行选项（A. … / B. …）；也认单行里内嵌的选项
  const lines = String(stem || '').split(/\r?\n/).map(x => x.trim()).filter(Boolean);
  const strip = x => x.replace(/^[A-H][.．、)）]\s*/, '').trim();
  if(!lines.length) return { head: '', opts: [] };
  if(lines.length >= 2 && /^[A-H][.．、)）]/.test(lines[1])){
    return { head: lines[0], opts: lines.slice(1).map(strip) };
  }
  const m = lines.join(' ').match(/^(.*?)\s+A[.．、)）]\s*(.+)$/);
  if(m && /(?:^|\s)[B-H][.．、)）]\s*\S/.test(m[2])){
    const opts = m[2].split(/\s+(?=[B-H][.．、)）]\s*\S)/).map(strip).filter(Boolean);
    if(opts.length >= 2) return { head: m[1].trim(), opts };
  }
  return { head: lines.join('\n'), opts: [] };
}

function ttsText(s){
  // 定位句里拿去朗读的部分：去加粗、去中文括注、去题号标记；还剩中文就不读
  let t = String(s || '').replace(/\*\*/g, '');
  for(let i = 0; i < 3; i++) t = t.replace(/[（(][^（）()]*[\u4e00-\u9fff][^（）()]*[）)]/g, '');
  t = t.replace(/\s*[(（](?:Q\d+|第\s*\d+\s*题|Para\s+[A-Z]|第\s*\d+\s*段)[)）]\s*/gi, ' ');
  const cjk = t.search(/[\u4e00-\u9fff]/);
  if(cjk >= 0){
    t = t.slice(0, cjk).replace(/[\s(（….,;；:：\-—]+$/, '');
  }
  return t.trim().replace(/\s+([.,;:!?])/g, '$1');
}

function normAns(s){
  return String(s == null ? '' : s).replace(/\*\*/g, '').toLowerCase()
    .replace(/[（(][^()（）]*[)）]/g, '')
    .replace(/^[\s"'“‘(（]+/, '').replace(/[\s)"”’'.,，。;；:：!?！？]+$/, '')
    .replace(/\s+/g, ' ').trim();
}

function answerMatches(card, typed){
  // 听写：正确答案里有「/」「或」表示多个备选，对一个就算对
  const a = normAns(card.ans), v = normAns(typed);
  if(!v || !a) return false;
  return a.split(/\s*(?:\/|或)\s*/).some(x => normAns(x) === v);
}

function optionMatches(text, letter, ans){
  // 点选项：正确答案是字母（A / A. … / B, C）或选项原文；「TRUE / YES」这种按每一半比
  const raw = String(ans == null ? '' : ans);
  const L = letter.toUpperCase();
  if(/(^|[\s,，、;；])[A-H](?=$|[\s.,，、)）])/.test(raw)){
    return new RegExp('(^|[\s,，、;；])' + L + '(?=$|[\s.,，、)）])').test(raw);
  }
  const a = normAns(raw), t = normAns(text);
  const parts = String(text || '').split(/\s*\/\s*/).map(normAns).filter(Boolean);
  return !!a && (parts.some(p => p === a) || a === t
    || (a.includes(t) && t.length >= 8) || (t.includes(a) && a.length >= 8));
}

function errorSteps(card){
  const L = s => String(s || '').split(/\r?\n/).map(x => x.trim()).filter(Boolean);
  const legacy = !(card.pairs && card.pairs.length || card.sig || card.trap || card.next || card.pre);
  const rows = [];
  if(card.pre)  rows.push(['前一句（干扰）', `<div class="ex quote">${esc(card.pre)}</div>`]);
  if(card.ev)   rows.push(['定位句', `<div class="ex quote">${bold(card.ev, card.ans)}</div>`]);
  if(card.pairs && card.pairs.length) rows.push(['同义替换', card.pairs.map(p =>
    `<div class="pair">${esc(p).replace(/→/g, '<span class="arrow">→</span>')}</div>`).join('')]);
  const s = [card.sig && '信号词：' + card.sig, card.trap && '干扰项：' + card.trap].filter(Boolean);
  if(s.length)  rows.push(['信号词 / 干扰项', s.map(x => `<div class="col">${esc(x)}</div>`).join('')]);
  if(card.note) rows.push(['当时为什么错', L(card.note).map(x => `<div class="col">${esc(x)}</div>`).join('')]);
  if(card.next) rows.push(['下次动作', `<div class="col next">${esc(card.next)}</div>`]);
  return rows.map(([k, body], i) =>
    `<details class="step"${(legacy || i === 0) ? ' open' : ''} data-noflip><summary>${i + 1}. ${k}</summary><div class="stepbody">${body}</div></details>`
  ).join('');
}

function renderError(card){
  const o = optLines(card.stem);
  const listen = card.skill === '听力' && !!ttsText(card.ev);      // 听力且定位句能朗读
  const opts = o.opts.length ? o.opts
    : (card.type === '判断题' ? ['TRUE / YES', 'FALSE / NO', 'NOT GIVEN'] : []);
  const dict = listen && !opts.length && ERR_FILL.indexOf(card.type) >= 0;
  const st = SRS[card.id];
  const goodTip = (st && st.s >= 1) ? '移出队列' : '再对一次出队';

  app.innerHTML = `
    ${progressBar()}
    <div class="scene">
      <div class="card" id="card" data-flip>
        <div class="face">
          <div class="tags">
            ${card.skill ? `<span class="tag l">${esc(card.skill)}</span>` : ''}
            <span class="tag">${esc(card.type || '')}</span>
            ${card.cause ? `<span class="tag r">${esc(card.cause)}</span>` : ''}
            <span class="tag">${esc(card.qid)}</span>
          </div>
          ${hasStem(card)
            ? `<div class="stem">${esc(o.head)}</div>`
            : `<div class="stem sub" style="font-weight:500">这题没存题干。你当时写的是「${esc(card.mine || '空')}」，想想正确答案是什么。</div>`}
          ${opts.length ? `<div class="opts">${opts.map((t, i) =>
            `<button class="opt" data-opt="${i}" data-noflip><span class="ol">${String.fromCharCode(65 + i)}</span><span>${esc(t)}</span></button>`).join('')}</div>` : ''}
          ${listen ? `<div class="player" data-noflip>
              <button class="pbtn" id="elPlay">▶ 听定位句</button>
              ${card.pre ? `<button class="pbtn" id="elPre">连前一句听</button>` : ''}
              <button class="pbtn" id="elSlow">慢速</button>
            </div>` : ''}
          ${dict ? `<div class="spellrow" data-noflip>
              <input id="elAns" class="spell-in" autocomplete="off" autocapitalize="none"
                     autocorrect="off" spellcheck="false" placeholder="听到什么写什么">
              <button class="btn" id="elCheck" style="padding:12px 14px">检查</button>
            </div>
            <div id="fb" class="hint" style="margin-top:10px"></div>` : ''}
          <div class="hint">${listen ? (dict ? '先听，写出答案，再翻面对照' : '先听再选 · 想好再点翻面') : '遮住答案重做 · 想好再点翻面'}</div>
        </div>
        <div class="face back">
          <div class="qid">${esc(card.qid)}</div>
          <div class="ansline">
            <div><span>你写的</span><b class="mine">${esc(card.mine || '（空）')}</b></div>
            <div><span>正确答案</span><b class="right">${esc(card.ans || '')}</b></div>
          </div>
          ${errorSteps(card)}
          <div class="src">${esc(card.src || '')}</div>
        </div>
      </div>
    </div>
    <div class="grades" id="grades" style="visibility:hidden">
      <button class="grade bad" data-r="0" style="grid-column:1/2">还是错<small>2 天后再来</small></button>
      <button class="grade good" data-r="1" style="grid-column:3/4">会了<small>${goodTip}</small></button>
    </div>`;

  $('quit').onclick = () => { if(confirm('结束本轮？')) finish(true); };

  if(listen){
    const text = ttsText(card.ev), pre = ttsText(card.pre);
    let slow = false;
    const play = t => speak(t, slow ? 0.65 : 0.9);
    $('elPlay').onclick = (e) => { e.stopPropagation(); play(text); };
    $('elSlow').onclick = (e) => { e.stopPropagation(); slow = !slow; e.currentTarget.classList.toggle('on', slow); };
    if(card.pre) $('elPre').onclick = (e) => { e.stopPropagation(); play(pre + '. ' + text); };
  }
  if(dict){
    const check = () => {
      const v = ($('elAns').value || '').trim();
      if(!v) return;
      const ok = answerMatches(card, v);
      $('fb').innerHTML = ok
        ? '<span style="color:var(--good)">✓ 听对了</span>'
        : `<span style="color:var(--bad)">✗ 再翻面对照</span>`;
      flip($('card'));
    };
    $('elCheck').onclick = (e) => { e.stopPropagation(); check(); };
    $('elAns').onkeydown = (e) => { if(e.key === 'Enter'){ e.preventDefault(); check(); } };
  }
  if(opts.length){
    app.querySelectorAll('.opt').forEach(b => b.onclick = (e) => {
      e.stopPropagation();
      const i = +b.dataset.opt, letter = String.fromCharCode(65 + i);
      const right = optionMatches(opts[i], letter, card.ans);
      if(right) b.classList.add('ok'); else b.classList.add('no');
      // 答错时把正确的那项也标出来
      if(!right) app.querySelectorAll('.opt').forEach((x, j) => {
        if(optionMatches(opts[j], String.fromCharCode(65 + j), card.ans)) x.classList.add('ok');
      });
      setTimeout(() => { if(document.getElementById('card')) flip($('card')); }, 450);
    });
  }
  dbg('render error: ' + card.qid + (listen ? ' [listen]' : ''));
}

function next(ok, isErr){
  ok ? SESSION.right++ : SESSION.wrong++;
  if(!SESSION.practice){
    STAT.total = (STAT.total || 0) + 1;
    if(!isErr){   // 错题不占背单词的每日配额，免得刷 20 道错题让当天少背 20 个词
      if(STAT.doneDay !== dayStr()){ STAT.doneDay = dayStr(); STAT.doneCount = 0; }
      STAT.doneCount = (STAT.doneCount || 0) + 1;
    }
    saveStat();
  }
  stopSpeak();
  SESSION.i++;
  if(SESSION.i >= SESSION.items.length) finish();
  else renderCard();
}

function finish(early){
  if(!SESSION.practice) bumpSession();
  stopSpeak();
  const back = SESSION.back;
  const done = SESSION.i;
  app.innerHTML = `
    <div class="done">
      <div class="big">${done ? '🎉' : '👋'}</div>
      <h2>${done ? '这轮完成' : '已保存'}</h2>
      <p>${done ? '明天继续，别断' : '答过的都记下了'}</p>
      <div class="stats">
        <div><b>${SESSION.right}</b><span>会了</span></div>
        <div><b>${SESSION.wrong}</b><span>要重来</span></div>
        <div><b>🔥 ${STAT.streak}</b><span>连续天数</span></div>
      </div>
      <div style="width:100%;margin-top:26px">
        <button class="btn primary" id="backHome" style="width:100%;justify-content:center">${back ? '回到错题' : '回到首页'}</button>
      </div>
    </div>`;
  $('backHome').onclick = back || home;
  renderStreak();
}

/* ---------------- utils ---------------- */
function esc(s){ return String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function bold(text, word){
  let html = esc(text);
  html = html.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  if(word && !html.includes('<b>')){
    const w = word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    html = html.replace(new RegExp(`(${w}\\w*)`, 'i'), '<b>$1</b>');
  }
  return html;
}

function speak(text, rate){
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; u.rate = rate || 0.9;
    speechSynthesis.speak(u);
  }catch(e){ toast('这台设备不支持朗读'); }
}

function stopSpeak(){
  try{ if(window.speechSynthesis) speechSynthesis.cancel(); }catch(_){}
}

function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(()=> t.classList.remove('show'), 2600);
}
window.addEventListener('error', (e) => {
  try{ toast('出错了：' + (e.message || '未知')); }catch(_){}
});

/* ---------------- 事件委托（iOS 上比逐元素 onclick 可靠） ---------------- */
function flip(card){
  card.classList.toggle('flipped');
  const g = document.getElementById('grades');
  if(g) g.style.visibility = card.classList.contains('flipped') ? 'visible' : 'hidden';
  dbg('flip -> ' + card.classList.contains('flipped'));
}

function handleGrade(r){
  if(!SESSION || !document.getElementById('card')) return;
  const item = SESSION.items[SESSION.i];
  if(!item) return;
  dbg('grade ' + r + ' on ' + (item.__err ? item.qid : item.w));
  if(item.__err){
    const ok = r === '1';
    if(!SESSION.practice){ try{ gradeError(item, ok); }catch(e){ console.error(e); } }
    next(ok, true);
  } else {
    if(!SESSION.practice){ try{ gradeCard(item, r); }catch(e){ console.error(e); } }
    next(r === 'good', false);
  }
}

let lastAct = 0;
function onPointer(e){
  const t = e.target;
  if(!t || !t.closest) return;
  if(t.closest('#speak') || t.closest('#quit')) return;
  if(t.closest('.w-grades')) return;
  if(t.closest('[data-noflip]')) return;     // 折叠块、播放区、听写框：点了不翻面
  const btn = t.closest('[data-r]');
  if(btn){
    if(Date.now() - lastAct < 350) return;
    lastAct = Date.now();
    handleGrade(btn.dataset.r);
    return;
  }
  if(t.closest('input') || t.closest('button')) return;   // 输入框/按钮不触发翻面
  const card = t.closest('[data-flip]');
  if(card) flip(card);
}
document.addEventListener('pointerdown', onPointer, true);
document.addEventListener('click', (e) => { if(!window.PointerEvent) onPointer(e); }, true);

/* ---------------- 调试面板（?debug=1） ---------------- */
const DEBUG = /[?&]debug=1/.test(location.search);
let dbgBox = null;
function dbg(msg){
  if(!DEBUG) return;
  if(!dbgBox){
    dbgBox = document.createElement('div');
    dbgBox.style.cssText = 'position:fixed;left:0;right:0;bottom:0;max-height:40vh;overflow:auto;' +
      'background:#000e;color:#7dff9b;font:11px/1.45 ui-monospace,monospace;padding:8px 10px;' +
      'z-index:9999;white-space:pre-wrap;pointer-events:none';
    document.body.appendChild(dbgBox);
    dbgBox.textContent = 'UA: ' + navigator.userAgent + '\n';
  }
  dbgBox.textContent += msg + '\n';
  dbgBox.scrollTop = dbgBox.scrollHeight;
}

/* ---------------- boot ---------------- */
async function boot(){
  loadAll();
  document.title = '雅思复习';
  try{
    const r = await fetch('deck.json?t=' + Date.now());
    if(!r.ok) throw new Error(r.status);
    DECK = await r.json();
  }catch(e){
    const why = location.protocol === 'file:'
      ? '这个页面不能双击打开，要先用网址访问（本地预览或 GitHub Pages 都行）'
      : (navigator.onLine === false
        ? '现在是断网状态，deck.json 又没进离线缓存，连上网再重试'
        : '页面是从缓存里打开的，但 deck.json 没拿到：本地预览服务可能已经关了，或者文件不在同一目录');
    app.innerHTML = `<div class="done"><div class="big">📭</div>
      <h2>词库没加载上</h2><p>${why}</p>
      <button class="btn" onclick="location.reload()" style="margin-top:20px">重试</button></div>`;
    return;
  }
  home();
  if(location.hash === '#write' && window.WRITING) window.WRITING.start();
  if(location.hash.indexOf('#cloze') === 0 && window.ESSAY){
    var __c = location.hash.slice(6).replace(/^=/, '').split('/');
    window.ESSAY.cloze(__c[0] || '', __c[1] || '');
  }
  if('serviceWorker' in navigator){
    let __swReloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if(__swReloaded) return; __swReloaded = true; location.reload();
    });
    navigator.serviceWorker.register('sw.js').then(reg => { if(reg.update) reg.update(); }).catch(()=>{});
  }
}
boot();
</script>
